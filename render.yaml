services:
  - type: web
    name: sadguru-tours-travels
    runtime: node
    plan: free
    buildCommand: npm install && cd server && npm install && cd .. && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
